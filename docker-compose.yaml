services:
  postgres:
    image: postgres:15
    ports:
      - '5435:5432' #이미 다른 프로제트에서 5432 포트를 사용중
    restart: always
    volumes:
      - ./postgres-data:/var/lib/postgresql/data #데이터 저장 방식을 현재 폴더에서 관리 할 예정
    environment:
      POSTGRES_USERNAME: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DATABASE: ${DB_DATABASE}
